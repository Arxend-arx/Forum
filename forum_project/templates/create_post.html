{% extends "base.html" %}
{% from "_editor.html" import editor %}
{% block title %}发布帖子 - AcademicForumLite{% endblock %}

{% block content %}
    <div class="card" style="max-width:700px; margin:0 auto;">
        <h2 style="margin-bottom:20px;">发布新帖子</h2>
        <form method="POST">
            <div class="form-group">
                <label for="title">标题</label>
                <input type="text" id="title" name="title" placeholder="请输入帖子标题" required>
            </div>
            <div class="form-group">
                <label for="content">正文内容</label>
                {{ editor('content', '支持 Markdown：文本、图片、视频、表情包、链接，也可以 @ 提及用户', '220px') }}
            </div>
            <button type="submit" class="btn btn-primary">发布</button>
            <a href="{{ url_for('index') }}" class="btn btn-cancel">取消</a>
        </form>
    </div>
{% endblock %}
