<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polarium</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><text x='50' y='68' font-size='52' font-weight='800' text-anchor='middle' fill='white' font-family='sans-serif'>P</text></svg>" />
</head>
<body>
  <div id="root"></div>
  <script>
    /* 防主题闪烁：默认深色，仅在用户主动切到 light 时用 light（独立 key 标记，避免旧 light 残留污染） */
    try {
      var t = localStorage.getItem('acad-theme-set') ? (localStorage.getItem('acad-theme') || 'dark') : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
