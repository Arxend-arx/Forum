<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy · Prototype A — 好友请求</title>
<link rel="stylesheet" href="prototype-a.css">
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <a class="brand" href="prototype-a.html"><span class="logo">A</span><span class="name" data-i18n="brand">Academy</span></a>
    <nav class="nav" id="nav"></nav>
    <div id="sideBottom"></div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1 data-i18n="friendsTitle">好友请求</h1>
        <div class="sub">1 <span data-i18n="pending">待处理</span></div>
      </div>
    </div>

    <div class="tabs">
      <button class="active" onclick="switchTab(this,0)" data-i18n="received">我收到的</button>
      <button onclick="switchTab(this,1)" data-i18n="sent">我发出的</button>
    </div>
    <div id="tabBody"></div>
  </main>
</div>

<script src="prototype-a-common.js"></script>
<script>
const RECEIVED = [{n:"白鹭洲", s:"LLM · 5 posts", time:"09:15"}];
const SENT = [{n:"林晚舟", s:"机器学习 · 12 posts", time:"08-02"}];
function switchTab(btn, idx){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const L = t;
  const list = idx===0 ? RECEIVED : SENT;
  const empty = idx===0 ? 'emptyReceived' : 'emptySent';
  document.getElementById('tabBody').innerHTML = list.length ? list.map(u=>`
    <div class="card" style="display:flex;align-items:center;gap:14px">
      <span class="avatar">${avatarChar(u.n)}</span>
      <div class="grow">
        <div style="font-weight:700">${u.n}</div>
        <div class="muted" style="font-size:12.5px">${u.s} · ${u.time}</div>
      </div>
      <div class="row" style="gap:8px">
        ${idx===0 ? `<button class="btn btn-primary btn-sm" onclick="toast('success', t('saved'))">${L('accept')}</button><button class="btn btn-ghost btn-sm" onclick="this.closest('.card').remove()">${L('reject')}</button>` : `<span class="tag warn">${L('pending')}</span>`}
      </div>
    </div>`).join('') : `<div class="empty"><h3>${L(empty)}</h3></div>`;
}
renderNav('messages');
switchTab(document.querySelector('#tabs button'), 0);
</script>
</body>
</html>
