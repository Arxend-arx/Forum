<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy · Prototype A — 发帖</title>
<link rel="stylesheet" href="prototype-a.css">
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <a class="brand" href="prototype-a.html"><span class="logo">A</span><span class="name" data-i18n="brand">Academy</span></a>
    <nav class="nav" id="nav"></nav>
    <div id="sideBottom"></div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1 data-i18n="newPost">发布帖子</h1>
        <div class="sub" data-i18n="editorTip">支持 **加粗**、`代码`、图片与视频</div>
      </div>
    </div>

    <form class="form" onsubmit="event.preventDefault();toast('success', t('saved'))">
      <div class="form-group">
        <label data-i18n="titlePh">帖子标题</label>
        <input class="input" data-i18n-ph="titlePh" placeholder="帖子标题">
      </div>

      <div class="form-group">
        <label data-i18n="editorTip">内容</label>
        <div class="editor">
          <div class="toolbar">
            <button type="button" title="加粗"><b>B</b></button>
            <button type="button" title="斜体"><i>I</i></button>
            <button type="button" title="标题">H1</button>
            <button type="button" title="引用">❝</button>
            <button type="button" title="代码">`&lt;/&gt;`</button>
            <button type="button" title="链接">🔗</button>
            <button type="button" title="图片">🖼</button>
            <button type="button" title="视频">🎬</button>
            <button type="button" title="列表">☰</button>
            <span class="hint" style="margin-left:auto" id="edStatus">0 字</span>
          </div>
          <textarea data-i18n-ph="contentPh" placeholder="写点什么… 支持 Markdown" oninput="document.getElementById('edStatus').textContent=this.value.length+' 字'"></textarea>
          <div class="statusbar" data-i18n="notImplemented">原型演示（静态页面）</div>
        </div>
      </div>

      <div class="row" style="justify-content:flex-end;gap:10px">
        <a class="btn btn-ghost" href="prototype-a.html" data-i18n="cancel">取消</a>
        <button class="btn btn-primary" type="submit" data-i18n="publish">发布</button>
      </div>
    </form>
  </main>
</div>

<script src="prototype-a-common.js"></script>
<script>
renderNav('create');
</script>
</body>
</html>
