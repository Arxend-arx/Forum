<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy · Prototype A — 信件箱</title>
<link rel="stylesheet" href="prototype-a.css">
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <a class="brand" href="prototype-a.html"><span class="logo">A</span><span class="name" data-i18n="brand">Academy</span></a>
    <nav class="nav" id="nav"></nav>
    <div id="sideBottom"></div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1 data-i18n="msgTitle">信件箱</h1>
        <div class="sub" data-i18n="markRead">打开即自动已读</div>
      </div>
      <div class="actions"><span class="badge">3</span></div>
    </div>

    <div class="card" style="padding:8px 10px" id="list"></div>
  </main>
</div>

<script src="prototype-a-common.js"></script>
<script>
const NOTICES = [
  {icon:"💬", t:"林晚舟", d:"在帖子中@了你", link:"prototype-a-post.html", time:"10:32", unread:true},
  {icon:"👥", t:"白鹭洲", d:"请求添加你为好友", link:"prototype-a-friends.html", time:"09:15", unread:true},
  {icon:"✅", t:"北辰光", d:"已接受你的好友请求", link:"prototype-a-chat.html", time:"昨天", unread:true},
  {icon:"💬", t:"苏黎", d:"评论了你的帖子", link:"prototype-a-post.html", time:"08-06", unread:false}
];
function render(){
  const L = t;
  document.getElementById('list').innerHTML = NOTICES.map(n=>`
    <a class="list-item" href="${n.link}" style="${n.unread?'background:rgba(79,107,255,.06);border-radius:10px':''}">
      <span class="avatar" style="background:var(--surface-3);font-size:16px">${n.icon}</span>
      <div class="main">
        <div class="title">${n.t} <span class="muted" style="font-weight:400">${n.d}</span></div>
        <div class="desc">${n.time}</div>
      </div>
      ${n.unread ? '<span class="dot" style="background:var(--primary);width:8px;height:8px"></span>' : ''}
    </a>`).join('');
}
document.addEventListener('langchange', render);
renderNav('messages');
render();
</script>
</body>
</html>
