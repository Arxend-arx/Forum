<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy · Prototype A — 编辑资料</title>
<link rel="stylesheet" href="prototype-a.css">
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <a class="brand" href="prototype-a.html"><span class="logo">A</span><span class="name" data-i18n="brand">Academy</span></a>
    <nav class="nav" id="nav"></nav>
    <div id="sideBottom"></div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1 data-i18n="editProfile">编辑资料</h1>
        <div class="sub">@ 林晚舟</div>
      </div>
    </div>

    <form class="card form" onsubmit="event.preventDefault();toast('success', t('saved'))">
      <div class="row" style="gap:18px">
        <span class="avatar lg">林</span>
        <div class="form-group grow">
          <label data-i18n="avatarLabel">头像（图片 URL）</label>
          <input class="input" value="https://example.com/avatar.png" data-i18n-ph="avatarPh" placeholder="粘贴头像图片地址">
        </div>
      </div>
      <div class="form-group">
        <label data-i18n="bioLabel">个人签名</label>
        <input class="input" value="专注于机器学习与信息检索，正在折腾 RAG。" data-i18n-ph="bioPh" placeholder="一句话介绍自己">
      </div>
      <div class="form-group">
        <label data-i18n="interestLabel">学习意向</label>
        <input class="input" value="深度学习、信息检索、NLP" data-i18n-ph="interestPh" placeholder="如：深度学习、NLP、前端工程">
        <span class="hint" data-i18n="interestPrefill">学习意向已预填</span>
      </div>
      <div class="row" style="justify-content:flex-end;gap:10px">
        <a class="btn btn-ghost" href="prototype-a-profile.html" data-i18n="cancel">取消</a>
        <button class="btn btn-primary" type="submit" data-i18n="saveProfile">保存修改</button>
      </div>
    </form>
  </main>
</div>

<script src="prototype-a-common.js"></script>
<script>
renderNav('profile');
</script>
</body>
</html>
