<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy · Prototype A — 个人资料</title>
<link rel="stylesheet" href="prototype-a.css">
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <a class="brand" href="prototype-a.html"><span class="logo">A</span><span class="name" data-i18n="brand">Academy</span></a>
    <nav class="nav" id="nav"></nav>
    <div id="sideBottom"></div>
  </aside>

  <main class="main">
    <div class="card">
      <div class="row" style="align-items:flex-start;gap:18px">
        <span class="avatar lg">林</span>
        <div class="grow">
          <h1 style="font-size:22px;font-weight:800">林晚舟 <span class="tag success">● <span data-i18n="on">在线</span></span></h1>
          <div class="muted mt-1" style="font-size:13px">2026-01-12 <span data-i18n="created">加入</span></div>
          <p class="mt-2" style="font-size:14px;color:var(--text-2)">专注于机器学习与信息检索，正在折腾 RAG。</p>
          <div class="row mt-2 wrap" style="gap:6px">
            <span class="chip">#深度学习</span><span class="chip">#信息检索</span><span class="chip">#NLP</span>
          </div>
        </div>
        <div class="row" style="gap:10px">
          <button class="btn btn-primary btn-sm" onclick="toast('success', t('saved'))" data-i18n="followBtn">关注</button>
          <a class="btn btn-ghost btn-sm" href="prototype-a-edit-profile.html" data-i18n="editBtn">编辑资料</a>
        </div>
      </div>
      <div class="divider"></div>
      <div class="stats">
        <div><div class="num">12</div><div class="lbl" data-i18n="postCount">帖子</div></div>
        <div><div class="num">34</div><div class="lbl" data-i18n="follower">粉丝</div></div>
        <div><div class="num">18</div><div class="lbl" data-i18n="following">关注</div></div>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button class="active" data-i18n="recentPosts">最近的帖子</button>
      <button data-i18n="follower">粉丝</button>
      <button data-i18n="following">关注</button>
    </div>
    <div id="tabBody"></div>
  </main>
</div>

<script src="prototype-a-common.js"></script>
<script>
const MY_POSTS = [
  {t:"从零实现一个轻量 RAG 问答系统的心得", d:"2026-08-07", cm:23},
  {t:"聊聊 embedding 模型的评测方法", d:"2026-08-01", cm:9},
  {t:"信息检索课程期末项目总结", d:"2026-07-20", cm:15}
];
const PEOPLE = [["苏黎","NLP"],["北辰光","前端工程"],["白鹭洲","LLM"]];
function renderTab(idx){
  const L = t;
  if(idx===0){
    document.getElementById('tabBody').innerHTML = MY_POSTS.map(p=>`
      <a class="card post click" href="prototype-a-post.html">
        <h3 style="font-size:15.5px">${p.t}</h3>
        <div class="muted" style="font-size:12.5px">${p.d} · ${p.cm} ${L('comments')}</div>
      </a>`).join('');
  } else {
    document.getElementById('tabBody').innerHTML = PEOPLE.map(p=>`
      <div class="list-item">
        <span class="avatar">${avatarChar(p[0])}</span>
        <div class="main"><div class="title">${p[0]}</div><div class="desc">${p[1]}</div></div>
        <button class="btn btn-ghost btn-sm" onclick="toast('success', t('saved'))">${L('followBtn')}</button>
      </div>`).join('');
  }
}
renderNav('profile');
document.addEventListener('langchange', ()=>renderTab(currentTab));
let currentTab = 0;
function bindTabs(){
  document.getElementById('tabs').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{
    document.getElementById('tabs').querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); currentTab = i; renderTab(i);
  });
}
bindTabs();
renderTab(0);
</script>
</body>
</html>
