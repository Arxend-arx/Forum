<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy · Prototype A — 注册</title>
<link rel="stylesheet" href="prototype-a.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-lang">
    <button id="authLang" onclick="toggleLang()">EN</button>
    <button id="authTheme" onclick="toggleTheme()">浅色</button>
  </div>

  <div class="auth-card">
    <a class="brand" href="prototype-a.html">
      <span class="logo">A</span>
      <span class="name" data-i18n="brand">Academy</span>
    </a>
    <h1 data-i18n="createAccount">创建账号</h1>
    <p class="sub" data-i18n="regSub">加入 Academy，与同好一起成长</p>

    <form class="form" onsubmit="event.preventDefault();toast('success', t('saved'))">
      <div class="form-group">
        <label data-i18n="username">用户名</label>
        <input class="input" data-i18n-ph="usernamePh" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label data-i18n="password">密码</label>
        <input class="input" type="password" data-i18n-ph="passwordPh" placeholder="请输入密码">
      </div>
      <div class="form-group">
        <label data-i18n="confirmPwd">确认密码</label>
        <input class="input" type="password" data-i18n-ph="passwordPh" placeholder="请输入密码">
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit" data-i18n="register">注册</button>
    </form>

    <p class="auth-alt"><span data-i18n="hasAccount">已有账号？</span> <a href="prototype-a-login.html" data-i18n="loginNow">立即登录</a></p>
  </div>
</div>

<script src="prototype-a-common.js"></script>
<script>
function updAuth(){
  const l = document.getElementById('authLang'), th = document.getElementById('authTheme');
  if (l) l.textContent = LANG === 'zh' ? 'EN' : '中';
  if (th) th.textContent = THEME === 'dark' ? (LANG === 'zh' ? '浅色' : 'Light') : (LANG === 'zh' ? '深色' : 'Dark');
}
document.addEventListener('langchange', updAuth);
document.addEventListener('themechange', updAuth);
applyLang(LANG); applyTheme(THEME);
updAuth();
</script>
</body>
</html>
