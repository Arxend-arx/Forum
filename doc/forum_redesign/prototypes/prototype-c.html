<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy — Prototype C · 墨线极简</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --primary:#7c5cff; --primary-2:#9d84ff; --ink:#14151c;
  --radius:4px; --font:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
}
:root[data-theme="light"]{
  --bg:#fbfbfc; --surface:#ffffff; --surface-2:#f6f6f8;
  --line:#e6e6ea; --line-strong:#d6d6dc;
  --text:#14151c; --text-2:#66667a; --text-3:#9a9aab;
  --shadow:none;
}
:root[data-theme="dark"]{
  --bg:#131318; --surface:#18181f; --surface-2:#1f1f28;
  --line:#2c2c37; --line-strong:#3a3a47;
  --text:#ececf2; --text-2:#9c9cae; --text-3:#6b6b7d;
  --shadow:none;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.65;transition:background .25s,color .25s}
a{color:inherit;text-decoration:none}
/* ============ 顶部细导航 ============ */
.topbar{
  display:flex;align-items:center;gap:22px;
  padding:0 clamp(16px,4vw,48px);height:54px;
  border-bottom:1px solid var(--line);background:var(--bg);
  position:sticky;top:0;z-index:30;
}
.brand{font-size:16px;font-weight:800;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
.brand .mark{width:7px;height:7px;background:var(--primary);display:inline-block}
.topnav{display:flex;gap:2px}
.topnav a{padding:6px 12px;font-size:13.5px;color:var(--text-2);border-bottom:2px solid transparent;transition:color .15s}
.topnav a:hover{color:var(--text)}
.topnav a.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:6px 12px}
.search input{width:150px;background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:var(--font)}
.search input::placeholder{color:var(--text-3)}
.search svg{width:14px;height:14px;stroke:var(--text-3)}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--text);padding:7px 14px;font-size:13px;cursor:pointer;font-family:var(--font);transition:all .15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-solid{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-solid:hover{color:#fff;background:var(--primary-2);border-color:var(--primary-2)}
.avatar{width:30px;height:30px;border:1px solid var(--line-strong);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--primary)}

/* ============ 双栏 ============ */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:36px;max-width:1080px;margin:0 auto;padding:32px clamp(16px,4vw,48px) 70px}
.main-col{min-width:0}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
.page-head .sub{font-size:13px;color:var(--text-3);padding-bottom:3px}
.page-head .ctrl{margin-left:auto;display:flex;gap:8px}
.btn-sm{padding:5px 10px;font-size:12px}

/* 帖子项：细线框列表 */
.post{
  display:block;padding:20px 2px;border-bottom:1px solid var(--line);transition:background .15s;
}
.post:hover{background:var(--surface-2)}
.post .meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-3);margin-bottom:8px}
.post .meta .dot{width:3px;height:3px;background:var(--text-3);border-radius:50%}
.post h2{font-size:17px;font-weight:700;letter-spacing:-.2px;margin-bottom:6px;line-height:1.45}
.post h2 a:hover{color:var(--primary)}
.post .excerpt{font-size:14px;color:var(--text-2);margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .tags{display:flex;gap:6px}
.post .tags span{font-size:12px;color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 30%, transparent);padding:1px 8px}
.post .stats{display:flex;gap:16px;margin-top:10px;font-size:12.5px;color:var(--text-3)}
.post .stats b{font-weight:600;color:var(--text-2)}

/* 右栏 */
.rail-col{display:flex;flex-direction:column;gap:22px}
.rail-block{border-top:2px solid var(--text)}
.rail-block h3{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3);padding:10px 0 12px}
.rail-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rail-item .rank{font-weight:800;color:var(--text-3);font-size:12px;min-width:20px}
.rail-item .name{font-weight:600}
.rail-item .val{color:var(--text-3);font-size:12.5px}
.quote{padding:14px;border-left:2px solid var(--primary);background:var(--surface-2);font-size:13.5px;color:var(--text-2);font-style:italic;line-height:1.7}
.footer{padding:24px;text-align:center;font-size:12.5px;color:var(--text-3);border-top:1px solid var(--line)}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .rail-col{order:2}
  .search{display:none}
  .topnav a:not(.active){display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#"><span class="mark"></span><span data-i18n="brand">ACADEMY</span></a>
  <nav class="topnav">
    <a href="#" class="active" data-i18n="home">首页</a>
    <a href="#" data-i18n="match">学术</a>
    <a href="#" data-i18n="chat">聊天</a>
    <a href="#" data-i18n="messages">信箱</a>
  </nav>
  <div class="top-right">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input data-i18n-ph="searchPh" placeholder="搜索…">
    </div>
    <button class="btn btn-sm" id="btnLang" data-i18n="langBtn">EN</button>
    <button class="btn btn-sm" id="btnTheme" data-i18n="themeBtn">深色</button>
    <button class="btn btn-sm btn-solid" data-i18n="newPost">发布</button>
    <span class="avatar">星</span>
  </div>
</header>

<div class="grid">
  <main class="main-col">
    <div class="page-head">
      <div>
        <h1 data-i18n="feedTitle">帖子流</h1>
        <div class="sub" data-i18n="feedSub">按时间倒序 · 共 128 篇</div>
      </div>
      <div class="ctrl">
        <button class="btn btn-sm" data-i18n="sortNew">最新</button>
        <button class="btn btn-sm" data-i18n="sortHot">热门</button>
      </div>
    </div>
    <div id="feed"></div>
  </main>

  <aside class="rail-col">
    <div class="rail-block">
      <h3 data-i18n="hotPosts">本周热门</h3>
      <div id="hotList"></div>
    </div>
    <div class="rail-block">
      <h3 data-i18n="members">成员榜</h3>
      <div id="memberList"></div>
    </div>
    <div class="rail-block">
      <h3 data-i18n="note">编辑手记</h3>
      <p class="quote" data-i18n="quote">「好的社区工具应当安静地退到内容身后，让文字与思想成为唯一的焦点。」</p>
    </div>
  </aside>
</div>

<footer class="footer">© 2026 Academy · <span data-i18n="footer">React + Flask SPA · Minimal</span></footer>

<script>
const POSTS = [
  {a:"林晚舟", t:"2026-08-07", tag:"#深度学习", title:"从零实现一个轻量 RAG 问答系统的心得", excerpt:"最近把文档检索 + 向量化的流程整个跑通了，记录一下踩过的坑：分块粒度、Embedding 模型选择、以及召回排序的取舍……", cm:23, lk:47},
  {a:"北辰光", t:"2026-08-06", tag:"#前端工程", title:"React + Vite 项目里我是如何组织目录的", excerpt:"组件、页面、hooks、api、i18n、主题，每一层的职责边界清晰，重构时省了非常多的时间，分享我的目录规范……", cm:15, lk:32},
  {a:"苏黎", t:"2026-08-06", tag:"#论文阅读", title:"Attention Is All You Need 读后笔记（一）", excerpt:"重新精读了一遍 Transformer 原文，把自注意力、位置编码、训练技巧整理成了一份可复用的读书模板……", cm:31, lk:56},
  {a:"星野原", t:"2026-08-05", tag:"#LLM", title:"Using open-source models for local academic search", excerpt:"A practical walkthrough of self-hosted embedding + rerank pipelines for literature retrieval, with latency budgets.", cm:9, lk:21},
  {a:"白鹭洲", t:"2026-08-04", tag:"#统计学", title:"贝叶斯与频率派：一个案例两种结论", excerpt:"用同一个 AB 实验的数据，分别从贝叶斯和频率派的角度给出结论，直观感受先验与后验的相互作用……", cm:18, lk:29}
];
const HOT = [["RAG 问答系统心得",23],["Transformer 读后笔记",31],["React 目录组织",15],["本地学术检索",9],["贝叶斯 vs 频率派",18]];
const MEMBERS = [["林晚舟","128"],["苏黎","96"],["北辰光","87"],["白鹭洲","63"],["星野原","41"]];
const I18N = {
  zh:{brand:"ACADEMY",home:"首页",match:"学术",chat:"聊天",messages:"信箱",newPost:"发布",searchPh:"搜索…",langBtn:"EN",themeBtn:"深色",feedTitle:"帖子流",feedSub:"按时间倒序 · 共 128 篇",sortNew:"最新",sortHot:"热门",hotPosts:"本周热门",members:"成员榜",note:"编辑手记",quote:"「好的社区工具应当安静地退到内容身后，让文字与思想成为唯一的焦点。」",footer:"React + Flask SPA · Minimal",com:"评论",like:"赞",hot:"热度"},
  en:{brand:"ACADEMY",home:"Home",match:"Research",chat:"Chat",messages:"Inbox",newPost:"New",searchPh:"Search…",langBtn:"中",themeBtn:"Dark",feedTitle:"Feed",feedSub:"Newest first · 128 posts",sortNew:"New",sortHot:"Hot",hotPosts:"This Week",members:"Top Members",note:"Editorial",quote:"“Good community tools stay quiet behind the content, letting words and ideas be the only focus.”",footer:"React + Flask SPA · Minimal",com:"comments",like:"likes",hot:"hot"}
};
let lang = localStorage.getItem('acad-c-lang') || 'zh';
let theme = localStorage.getItem('acad-c-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

function applyLang(l){
  lang=l; localStorage.setItem('acad-c-lang',l);
  document.documentElement.lang = l==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = I18N[l][el.dataset.i18n] || el.textContent; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = I18N[l][el.dataset.i18nPh] || el.placeholder; });
  render();
}
function applyTheme(t){
  theme=t; localStorage.setItem('acad-c-theme',t);
  document.documentElement.dataset.theme=t;
  document.querySelector('#btnTheme').textContent = (lang==='zh'?(t==='dark'?'浅色':'深色'):(t==='dark'?'Light':'Dark'));
}
function render(){
  const L = I18N[lang];
  document.getElementById('feed').innerHTML = POSTS.map(p=>`
    <article class="post">
      <div class="meta"><span>${p.a}</span><span class="dot"></span><span>${p.t}</span><span class="dot"></span><span>${p.tag}</span></div>
      <h2><a href="#">${p.title}</a></h2>
      <p class="excerpt">${p.excerpt}</p>
      <div class="stats"><span>${L.com} <b>${p.cm}</b></span><span>${L.like} <b>${p.lk}</b></span></div>
    </article>`).join('');
  document.getElementById('hotList').innerHTML = HOT.map((h,i)=>`
    <div class="rail-item"><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="name">${h[0]}</span><span class="val">${h[1]}</span></div>`).join('');
  document.getElementById('memberList').innerHTML = MEMBERS.map((m,i)=>`
    <div class="rail-item"><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="name">${m[0]}</span><span class="val">${m[1]} pts</span></div>`).join('');
}
document.getElementById('btnLang').onclick = ()=>applyLang(lang==='zh'?'en':'zh');
document.getElementById('btnTheme').onclick = ()=>applyTheme(theme==='light'?'dark':'light');
applyLang(lang); applyTheme(theme);
</script>
</body>
</html>
