<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy — Prototype B · 云白轻盈</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --primary:#0ea5a4; --primary-2:#14b8b6; --accent:#f59e0b;
  --radius:18px; --radius-sm:12px;
  --font:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  --ease:cubic-bezier(.34,1.2,.4,1);
}
:root[data-theme="light"]{
  --bg:#f6faf9; --bg-2:#eef7f5;
  --surface:#ffffff; --surface-2:#f0f7f6;
  --border:#e3efed;
  --text:#17322f; --text-2:#5c7875; --text-3:#94afac;
  --shadow:0 10px 30px rgba(14,165,164,.10);
  --grad:linear-gradient(135deg,#0ea5a4,#34d399);
}
:root[data-theme="dark"]{
  --bg:#0f1b1a; --bg-2:#132221;
  --surface:#162624; --surface-2:#1d3130;
  --border:#24403e;
  --text:#e6f4f2; --text-2:#8fb3b0; --text-3:#5d827f;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --grad:linear-gradient(135deg,#0ea5a4,#34d399);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font); color:var(--text); background:
    radial-gradient(1200px 500px at 85% -10%, var(--bg-2), transparent 60%),
    radial-gradient(900px 420px at -10% 20%, var(--bg-2), transparent 55%),
    var(--bg);
  line-height:1.65; transition:background .3s var(--ease),color .3s var(--ease); min-height:100vh;
}
/* ============ 顶部通栏 ============ */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:14px;
  padding:12px clamp(14px,3.5vw,36px);
  background:color-mix(in srgb, var(--surface) 78%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand .logo{
  width:36px;height:36px;border-radius:12px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 6px 16px rgba(14,165,164,.35);
}
.brand .name{font-size:17px;font-weight:800;letter-spacing:.2px}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:999px;padding:9px 18px;transition:border-color .2s}
.search:focus-within{border-color:var(--primary)}
.search svg{width:16px;height:16px;stroke:var(--text-3)}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:var(--font)}
.search input::placeholder{color:var(--text-3)}
.nav-links{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav-links a{
  padding:8px 14px;border-radius:999px;color:var(--text-2);text-decoration:none;
  font-size:14px;font-weight:500;transition:all .18s;
}
.nav-links a:hover{color:var(--primary);background:var(--surface-2)}
.nav-links a.active{color:#fff;background:var(--grad);font-weight:600}
.nav-links .btn-cta{
  background:var(--grad);color:#fff;font-weight:700;padding:9px 18px;border-radius:999px;
  text-decoration:none;box-shadow:0 6px 16px rgba(14,165,164,.32);transition:transform .18s var(--ease);
}
.nav-links .btn-cta:hover{transform:translateY(-1px)}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);
  color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .18s;font-size:14px;font-family:var(--font);
}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer}

/* ============ 主区域 ============ */
.wrap{max-width:860px;margin:0 auto;padding:28px clamp(14px,3.5vw,36px) 60px}
.hero{margin-bottom:26px;text-align:center;padding:34px 20px;border-radius:24px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.hero h1{font-size:26px;font-weight:800;letter-spacing:.3px}
.hero p{color:var(--text-2);font-size:15px;margin-top:8px}
.hero .pill{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:5px 14px;border-radius:999px;background:var(--surface-2);color:var(--primary);font-size:12.5px;font-weight:600}
.section-head{display:flex;align-items:baseline;gap:10px;margin:24px 0 14px}
.section-head h2{font-size:18px;font-weight:800}
.section-head span{font-size:12.5px;color:var(--text-3)}
.section-head a{margin-left:auto;font-size:13px;color:var(--primary);text-decoration:none;font-weight:600}

/* 帖子卡片 */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow);transition:transform .2s var(--ease),box-shadow .2s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(14,165,164,.16)}
.card .head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.card .head .avatar{width:42px;height:42px;border-radius:14px}
.card .head .meta{flex:1}
.card .head .author{font-size:14.5px;font-weight:700}
.card .head .time{font-size:12.5px;color:var(--text-3)}
.pill{font-size:12px;padding:3px 12px;border-radius:999px;background:var(--surface-2);color:var(--primary);font-weight:600}
.card h3{font-size:18px;font-weight:800;margin-bottom:8px;line-height:1.45}
.card h3 a{color:var(--text);text-decoration:none;transition:color .15s}
.card h3 a:hover{color:var(--primary)}
.card .excerpt{font-size:14.5px;color:var(--text-2);margin-bottom:16px}
.card .foot{display:flex;align-items:center;gap:20px;padding-top:14px;border-top:1px dashed var(--border);font-size:13px;color:var(--text-3)}
.card .foot .stat{display:flex;align-items:center;gap:6px}
.card .foot .stat svg{width:16px;height:16px;stroke:var(--text-3)}
.card .foot .link{margin-left:auto;color:var(--primary);font-weight:600;text-decoration:none}

/* 用户卡片横排 */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.pcard:hover{transform:translateY(-3px)}
.pcard .avatar{width:52px;height:52px;border-radius:18px;margin:0 auto 10px;font-size:18px}
.pcard .n{font-weight:700;font-size:14.5px}
.pcard .s{font-size:12px;color:var(--text-3);margin-top:2px}
.pcard .f{display:inline-block;margin-top:10px;font-size:12px;padding:5px 16px;border-radius:999px;background:var(--grad);color:#fff;font-weight:600;text-decoration:none}

/* 底部 */
footer{text-align:center;padding:26px;color:var(--text-3);font-size:13px}
@media(max-width:820px){
  .search{display:none}
  .nav-links a:not(.active):not(.btn-cta){display:none}
  .hero h1{font-size:21px}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#"><span class="logo">A</span><span class="name" data-i18n="brand">Academy</span></a>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input data-i18n-ph="searchPh" placeholder="搜索帖子、用户或标签…">
  </div>
  <nav class="nav-links">
    <a href="#" class="active" data-i18n="home">首页</a>
    <a href="#" data-i18n="match">学术</a>
    <a href="#" data-i18n="chat">聊天</a>
    <a href="#" data-i18n="messages">信箱</a>
    <button class="icon-btn" id="btnLang" title="语言"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></button>
    <button class="icon-btn" id="btnTheme" title="主题"><svg id="iconTheme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <a class="btn-cta" href="#" data-i18n="newPost">发布帖子</a>
    <span class="avatar" title="星野原">星</span>
  </nav>
</header>

<div class="wrap">
  <div class="hero">
    <h1 data-i18n="welcome">欢迎回到 Academy</h1>
    <p data-i18n="heroSub">一个专注于学术讨论与资源分享的社区，和同好一起成长。</p>
    <span class="pill">● <span id="onlineNum">9</span> <span data-i18n="sOnline">人在线</span></span>
  </div>

  <div class="section-head">
    <h2 data-i18n="latest">最新帖子</h2><span data-i18n="latestSub">实时更新</span>
    <a href="#" data-i18n="viewAll">查看全部 →</a>
  </div>
  <div id="feed"></div>

  <div class="section-head">
    <h2 data-i18n="members">社区成员</h2><span data-i18n="membersSub">本周活跃</span>
  </div>
  <div class="people" id="people"></div>
</div>

<footer>© 2026 Academy · <span data-i18n="footer">React + Flask 前后端分离版原型</span></footer>

<script>
const POSTS = [
  {a:"林晚舟",t:"今天 09:24",tag:"#深度学习",title:"从零实现一个轻量 RAG 问答系统的心得",ex:"最近把文档检索 + 向量化的流程整个跑通了，记录一下踩过的坑：分块粒度、Embedding 模型选择、以及召回排序的取舍……",cm:23,lk:47},
  {a:"北辰光",t:"昨天 21:10",tag:"#前端工程",title:"React + Vite 项目里我是如何组织目录的",ex:"组件、页面、hooks、api、i18n、主题，每一层的职责边界清晰，重构时省了非常多的时间，分享我的目录规范……",cm:15,lk:32},
  {a:"苏黎",t:"昨天 14:02",tag:"#论文阅读",title:"Attention Is All You Need 读后笔记（一）",ex:"重新精读了一遍 Transformer 原文，把自注意力、位置编码、训练技巧整理成了一份可复用的读书模板……",cm:31,lk:56},
  {a:"星野原",t:"08-05 18:47",tag:"#LLM",title:"Using open-source models for local academic search",ex:"A practical walkthrough of self-hosted embedding + rerank pipelines for literature retrieval, with latency budgets.",cm:9,lk:21}
];
const PEOPLE = [
  {n:"林晚舟",s:"机器学习 · 12 posts"}, {n:"北辰光",s:"前端工程 · 8 posts"}, {n:"苏黎",s:"NLP · 6 posts"}, {n:"白鹭洲",s:"LLM · 5 posts"}
];
const I18N = {
  zh:{brand:"Academy",home:"首页",match:"学术",chat:"聊天",messages:"信箱",newPost:"发布帖子",searchPh:"搜索帖子、用户或标签…",welcome:"欢迎回到 Academy",heroSub:"一个专注于学术讨论与资源分享的社区，和同好一起成长。",sOnline:"人在线",latest:"最新帖子",latestSub:"实时更新",viewAll:"查看全部",members:"社区成员",membersSub:"本周活跃",footer:"React + Flask 前后端分离版原型",com:"评论",like:"赞",follow:"关注"},
  en:{brand:"Academy",home:"Home",match:"Research",chat:"Chat",messages:"Inbox",newPost:"New Post",searchPh:"Search posts, users or tags…",welcome:"Welcome back to Academy",heroSub:"A community for academic discussion and resource sharing.",sOnline:"online",latest:"Latest Posts",latestSub:"Live feed",viewAll:"View all",members:"Members",membersSub:"Active this week",footer:"React + Flask SPA prototype",com:"comments",like:"likes",follow:"Follow"}
};
let lang = localStorage.getItem('acad-b-lang') || 'zh';
let theme = localStorage.getItem('acad-b-theme') || 'light';
function applyLang(l){
  lang=l; localStorage.setItem('acad-b-lang',l);
  document.documentElement.lang = l==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=I18N[l][el.dataset.i18n]||el.textContent);
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=I18N[l][el.dataset.i18nPh]||el.placeholder);
  render();
}
function applyTheme(t){
  theme=t; localStorage.setItem('acad-b-theme',t);
  document.documentElement.dataset.theme=t;
}
function render(){
  const L=I18N[lang];
  document.getElementById('feed').innerHTML = POSTS.map(p=>`
    <article class="card">
      <div class="head">
        <span class="avatar">${p.a[0]}</span>
        <div class="meta"><div class="author">${p.a}</div><div class="time">${p.t}</div></div>
        <span class="pill">${p.tag}</span>
      </div>
      <h3><a href="#">${p.title}</a></h3>
      <p class="excerpt">${p.ex}</p>
      <div class="foot">
        <span class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.4-.7L3 21l1.8-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>${p.cm} ${L.com}</span>
        <span class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10v12M15 5.9V2a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.9z"/></svg>${p.lk} ${L.like}</span>
        <a class="link" href="#">${lang==='zh'?'阅读全文':'Read more'} →</a>
      </div>
    </article>`).join('');
  document.getElementById('people').innerHTML = PEOPLE.map(u=>`
    <div class="pcard">
      <span class="avatar">${u.n[0]}</span>
      <div class="n">${u.n}</div><div class="s">${u.s}</div>
      <a class="f" href="#">+ ${L.follow}</a>
    </div>`).join('');
}
document.getElementById('btnLang').onclick=()=>applyLang(lang==='zh'?'en':'zh');
document.getElementById('btnTheme').onclick=()=>applyTheme(theme==='light'?'dark':'light');
applyLang(lang); applyTheme(theme);
</script>
</body>
</html>
