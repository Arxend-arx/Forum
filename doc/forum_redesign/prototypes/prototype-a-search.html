<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy · Prototype A — 搜索</title>
<link rel="stylesheet" href="prototype-a.css">
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <a class="brand" href="prototype-a.html"><span class="logo">A</span><span class="name" data-i18n="brand">Academy</span></a>
    <nav class="nav" id="nav"></nav>
    <div id="sideBottom"></div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div class="searchbox grow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" value="RAG" data-i18n-ph="searchPh" placeholder="搜索帖子、用户或标签…" oninput="renderSearch(this.value)">
      </div>
      <button class="btn btn-primary" data-i18n="search">搜索</button>
    </div>

    <div class="tabs" id="tabs">
      <button class="active" data-i18n="posts">帖子</button>
      <button data-i18n="users">用户</button>
    </div>

    <div id="results"></div>
  </main>
</div>

<script src="prototype-a-common.js"></script>
<script>
const POSTS = [
  {a:"林晚舟", t:"2026-08-07", tag:"#深度学习", title:"从零实现一个轻量 RAG 问答系统的心得", ex:"最近把文档检索 + 向量化的流程整个跑通了，记录一下踩过的坑……", cm:23},
  {a:"苏黎", t:"2026-08-03", tag:"#NLP", title:"RAG 与长文本处理的工程实践", ex:"从切分到评估，聊聊生产中 RAG 管线到底该关注哪些指标……", cm:12}
];
const USERS = [
  {n:"林晚舟", s:"机器学习 · 12 posts"}, {n:"白鹭洲", s:"LLM · 5 posts"}
];
function renderSearch(kw){
  if(!kw){ document.getElementById('results').innerHTML=''; return; }
  document.getElementById('results').innerHTML =
    `<div class="card" style="padding:12px 16px;font-size:13.5px;color:var(--text-2)"><b style="color:var(--primary)">${esc(kw)}</b> — ${t('searchResult')}</div>` +
    POSTS.map(p=>`
      <article class="card post click">
        <div class="head">
          <span class="avatar">${avatarChar(p.a)}</span>
          <div class="meta"><div class="author">${p.a} <small>· ${p.t}</small></div><div class="time">${p.tag}</div></div>
          <span class="tag">${p.tag}</span>
        </div>
        <h3><a href="prototype-a-post.html">${p.title}</a></h3>
        <p class="excerpt">${p.ex}</p>
        <div class="foot"><span class="stat">${icon('M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.4-.7L3 21l1.8-5.6A8.4 8.4 0 1 1 21 11.5z')} ${p.cm} ${t('comments')}</span></div>
      </article>`).join('') +
    `<div class="divider"></div><h4 style="margin:8px 0 6px;font-size:14px;color:var(--text-2)">${t('users')}</h4>` +
    USERS.map(u=>`
      <a class="list-item" href="prototype-a-profile.html">
        <span class="avatar">${avatarChar(u.n)}</span>
        <div class="main"><div class="title">${u.n}</div><div class="desc">${u.s}</div></div>
        <span class="tag">@ ${u.n}</span>
      </a>`).join('');
}
document.addEventListener('langchange', ()=>renderSearch(document.getElementById('q').value));
renderNav('home');
renderSearch(document.getElementById('q').value);
</script>
</body>
</html>
